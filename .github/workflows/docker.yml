name: Build and push image to GHCR

on:
  push:
    branches: [main]
  # 需要手动重跑时，在 Actions 页面点 Run workflow
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # 用 GitHub 自带的 GITHUB_TOKEN 推送镜像，需要 packages: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Sealos 的节点可能是 arm64，同时构建两种架构最省事
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          # 镜像名固定成 ghcr.io/1374011685a-bit/wood-erp:latest
          tags: ghcr.io/1374011685a-bit/wood-erp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
